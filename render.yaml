services:
  - type: web
    name: promptly-render-clone
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: STREAMING_UI
        value: "false"
      - key: PROMPTLY_DATA_DIR
        value: /var/data
    disk:
      name: promptly-data
      mountPath: /var/data
      sizeGB: 1
